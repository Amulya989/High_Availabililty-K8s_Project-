apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: cont1
        image: amulya989/phpapp:appimg
        ports:
         - containerPort: 80
        envFrom:
         - configMapRef:
             name: myconfig
      
       
